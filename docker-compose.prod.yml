services:
  controller:
    ports: []
    environment:
      ENV: production

  dashboard:
    ports: []
    environment:
      ENV: production
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dashboard
      args:
        NEXT_PUBLIC_CONTROLLER_URL: ""
        NEXT_PUBLIC_WS_URL: ""

  worker-01:
    ports: []
    environment:
      NOVNC_PUBLIC_URL: /vnc/worker-01

  worker-02:
    ports: []
    environment:
      NOVNC_PUBLIC_URL: /vnc/worker-02

  worker-03:
    ports: []
    environment:
      NOVNC_PUBLIC_URL: /vnc/worker-03

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dashboard
      - controller
      - worker-01
      - worker-02
      - worker-03
    networks:
      - fleet
